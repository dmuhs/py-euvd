[project]
name = "py-euvd"
dynamic = ["version"]
description = "Dependency-free Python client for the EU Vulnerability Database (EUVD) API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dominik Muhs" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "euvd",
    "enisa",
    "vulnerability",
    "vulnerability-database",
    "cve",
    "kev",
    "epss",
    "cvss",
    "security",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://py-euvd.spoons.fyi"
Repository = "https://github.com/dmuhs/py-euvd"
Issues = "https://github.com/dmuhs/py-euvd/issues"
Changelog = "https://github.com/dmuhs/py-euvd/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "pytest-cov>=6", "ruff>=0.8"]
docs = ["mkdocstrings-python>=2", "zensical>=0.1.3"]
build = ["hatch-vcs>=0.4", "hatchling>=1.27"]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# The version comes from the git tag. A build at tag v1.2.3 is version 1.2.3.
[tool.hatch.version]
source = "vcs"

# Writes the version into the package at build time. The file is not checked in.
[tool.hatch.build.hooks.vcs]
version-file = "pyeuvd/_version.py"
template = "__version__ = \"{version}\"\n"

[tool.hatch.build.targets.wheel]
packages = ["pyeuvd"]

[tool.hatch.build.targets.sdist]
include = ["pyeuvd", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real EUVD API (run with: pytest -m live)"]

[tool.coverage.run]
source = ["pyeuvd"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["pyeuvd"]
