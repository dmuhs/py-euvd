name: Publish

# Runs when a GitHub release is published. Uploads to PyPI with trusted
# publishing, so no API token is stored in the repository.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # The version comes from the git tag, so the tags must be fetched.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run pytest --cov
      - run: uv build
      # Stops before the upload if the built version is not the released tag.
      - run: ls "dist/py_euvd-${GITHUB_REF_NAME#v}-py3-none-any.whl" "dist/py_euvd-${GITHUB_REF_NAME#v}.tar.gz"
      - uses: pypa/gh-action-pypi-publish@release/v1
