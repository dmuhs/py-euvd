# Configuration of the documentation site. Build it with: uv run --only-group docs zensical build

[project]
site_name = "py-euvd"
site_url = "https://py-euvd.spoons.fyi/"
site_description = "Dependency-free Python client for the EU Vulnerability Database (EUVD) API"
repo_url = "https://github.com/dmuhs/py-euvd"
repo_name = "dmuhs/py-euvd"

nav = [
  { "Get started" = "index.md" },
  { "Guide" = [
    { "Fetching data" = "fetching.md" },
    { "Searching" = "searching.md" },
    { "Results" = "results.md" },
    { "Async" = "async.md" },
    { "Errors" = "errors.md" },
    { "Customizing" = "customizing.md" },
    { "Examples" = "examples.md" },
  ] },
  { "Reference" = [
    { "Clients" = "reference/clients.md" },
    { "Results" = "reference/results.md" },
    { "Transports" = "reference/transports.md" },
    { "Errors" = "reference/errors.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

# The reference pages are generated from the docstrings in the pyeuvd package.
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
filters = ["!^_"]
heading_level = 2
inherited_members = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_attribute_values = false
show_bases = false
show_labels = false
show_root_full_path = false
show_root_heading = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
